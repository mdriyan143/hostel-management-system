<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooms &mdash; Hostel &amp; Mess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/nav-toggle.js"></script>
<button id="navToggle" class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Hostel<span>&amp;Mess</span></div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="students.html">Students</a>
      <a href="rooms.html" class="active">Rooms</a>
      <a href="attendance.html">Mess attendance</a>
      <a href="overview.html">Meal overview</a>
      <a href="contribution.html">Contribution overview</a>
      <a href="billing.html">Household bills</a>
      <a href="calculation.html">Mess calculation</a>
    </nav>
  </aside>

  <main class="main">
    <div class="page-head">
      <h1>Rooms</h1>
      <button onclick="openForm()">Add room</button>
    </div>

    <div id="formPanel" class="form-panel" style="display:none;">
      <h3 id="formTitle">Add room</h3>
      <input type="hidden" id="roomId">
      <div class="field-row">
        <div><label for="roomNumber">Room number</label><input id="roomNumber"></div>
        <div><label for="roomCapacity">Capacity</label><input id="roomCapacity" type="number" min="1"></div>
        <div><label for="roomRent">Monthly rent</label><input id="roomRent" type="number" min="0"></div>
      </div>
      <div id="formMsg"></div>
      <div style="margin-top:16px; display:flex; gap:10px;">
        <button onclick="saveRoom()">Save</button>
        <button class="ghost" onclick="closeForm()">Cancel</button>
      </div>
    </div>

    <table class="roll">
      <thead><tr><th>Room</th><th class="num">Occupied</th><th class="num">Capacity</th><th class="num">Rent</th><th></th></tr></thead>
      <tbody id="roomBody"><tr><td colspan="5">Loading&hellip;</td></tr></tbody>
    </table>
  </main>
</div>

<script type="module" src="js/rooms.js"></script>
</body>
</html>
